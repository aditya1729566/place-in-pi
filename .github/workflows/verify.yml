name: Verify
on:
  push:
    branches: [main, codex/pi-dictionary]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build search worker
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j2
      - name: Install API and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify independently computed fixture
        run: |
          python scripts/generate_fixture.py
          git diff --exit-code -- data/fixtures/pi-first-1000.digits
      - name: Import verified corpus and build index
        run: |
          python scripts/prepare_corpus.py
          python scripts/prefix_index.py
      - name: Test engine and API
        env:
          PYTHONPATH: backend:.
        run: python -m pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
