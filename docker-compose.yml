services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PI_CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data/corpus:/data/corpus:ro
      - ./data/index:/data/index:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
